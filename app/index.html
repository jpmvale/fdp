<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDP</title>
<style>
  :root {
    --bg: #12131a; --panel: #1c1e28; --line: #2c2f3d; --ink: #eceef5;
    --dim: #8b90a5; --accent: #f2b544; --danger: #f2685c; --ok: #59c98a;
    --amber:#f2b544; --teal:#3fb9b0; --rose:#f2708c; --indigo:#7b8cf5;
    --lime:#a3d45e; --sky:#54b4ef; --orange:#f28c4a; --violet:#b479f0;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif;
    min-height: 100dvh; padding: 16px; overflow-x: hidden;
  }
  main { max-width: 460px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-size: 30px; letter-spacing: -.5px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  button {
    font: inherit; font-weight: 600; color: #191b22; background: var(--accent);
    border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer; min-height: 44px;
  }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  input {
    font: inherit; width: 100%; padding: 12px; border-radius: 10px; min-height: 44px;
    background: #0e0f15; border: 1px solid var(--line); color: var(--ink);
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .code { font: 700 26px ui-monospace, monospace; letter-spacing: 5px; color: var(--accent); }
  .muted { color: var(--dim); font-size: 13px; }

  .player {
    display: flex; gap: 10px; align-items: center; padding: 9px 10px;
    border-radius: 10px; border: 1px solid transparent;
  }
  .player.turn { border-color: var(--accent); background: #ffffff08; }
  .player.doomed { opacity: .5; }
  .player.away { border-color: var(--danger); }
  .av { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; font-size: 19px; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 5px; background: #ffffff12; color: var(--dim); }

  .cards { display: flex; gap: 6px; flex-wrap: wrap; }
  .card {
    width: 46px; height: 66px; border-radius: 8px; background: #f6f7fb; color: #16181f;
    display: grid; place-content: center; font-weight: 700; font-size: 17px; border: 0;
    padding: 0; line-height: 1.1; text-align: center;
  }
  .card.red { color: #d1263c; }
  .card.back {
    background: repeating-linear-gradient(45deg, #37406b, #37406b 5px, #2a3157 5px, #2a3157 10px);
    color: #8e97c8; font-size: 22px;
  }
  .card.sel { outline: 3px solid var(--accent); transform: translateY(-6px); }
  .bets { display: flex; gap: 6px; flex-wrap: wrap; }
  .bets button { padding: 12px 0; min-width: 46px; }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--danger); color: #fff; padding: 11px 16px; border-radius: 10px;
    max-width: 90vw; z-index: 9;
  }
  .banner { padding: 11px; border-radius: 10px; background: #ffffff10; text-align: center; }
  .banner.warn { background: #f2685c22; border: 1px solid var(--danger); }
  .log { max-height: 130px; overflow-y: auto; font-size: 12px; color: var(--dim); display: grid; gap: 3px; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const app = document.getElementById('app');

const S = { screen: 'home', me: null, token: null, code: null, wsUrl: null, snap: null, sel: null, log: [], err: null };
let ws = null;

// `06` §4: uma sessão por sala, para participar de salas diferentes em abas
// diferentes. O token é assinado e escopado — guardá-lo aqui não dá acesso a
// nada além daquela sala, e ele expira com ela.
const guardado = (code) => localStorage.getItem(`fdp.session.${code}`);
const guardar = (code, token) => localStorage.setItem(`fdp.session.${code}`, token);
const esquecer = (code) => localStorage.removeItem(`fdp.session.${code}`);

const api = (path, body) => fetch(path, {
  method: body ? 'POST' : 'GET',
  headers: { 'content-type': 'application/json' },
  body: body ? JSON.stringify(body) : undefined,
}).then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.motivo || d.code); return d; });

function connect() {
  ws = new WebSocket(`${S.wsUrl}?token=${encodeURIComponent(S.token)}`);
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  // Reconectar é um resync: não há caminho separado para recuperar partida.
  // Mas nem todo fechamento pede insistência: sessão assumida em outra aba e
  // token inválido são respostas, não falhas de rede. Martelar o servidor
  // nesses casos é o cliente brigando com uma decisão já tomada.
  ws.onclose = (e) => {
    if (e.code === 4009) { S.err = 'sala aberta em outra aba'; S.token = null; render(); return; }
    if (e.code === 4003 || e.code === 4004) { esquecer(S.code); sair(); return; }
    if (S.token) setTimeout(connect, 700);
  };
}

function sair() {
  S.screen = 'home'; S.token = null; S.snap = null; S.code = null; S.wsUrl = null;
  render();
}

const cmd = (type, payload = {}) =>
  ws?.readyState === 1 && ws.send(JSON.stringify({ v: 1, id: crypto.randomUUID(), type, ts: Date.now(), payload }));

function handle(msg) {
  if (msg.type === 'room:snapshot') { S.snap = msg.payload; S.screen = 'room'; S.sel = null; }
  else if (msg.type === 'error') { S.err = msg.payload.params?.motivo || msg.payload.code; setTimeout(() => { S.err = null; render(); }, 2600); }
  else {
    note(msg);
    // Qualquer evento que mude o jogo pede o retrato novo. Simples e sempre
    // correto — o servidor é a autoridade.
    cmd('room:resync');
  }
  render();
}

function note(msg) {
  const p = msg.payload || {}, n = (id) => S.snap?.players?.find((x) => x.id === id)?.nickname || '?';
  const t = {
    'move:betPlaced': () => `${n(p.playerId)} apostou ${p.bet}`,
    'move:cardPlayed': () => `${n(p.playerId)} jogou ${p.card.rank}`,
    'trick:resolved': () => p.annulled ? `empate em ${p.annulledValue} — vaza de ninguém` : `${n(p.winnerId)} levou a vaza`,
    'move:autoPlayed': () => `${n(p.playerId)} ficou sem tempo`,
    'match:paused': () => `pausado: ${p.absentPlayerIds.map(n).join(', ')} caiu`,
    'match:resumed': () => 'partida retomada',
    'round:aborted': () => 'rodada recomeçou sem quem saiu',
    'round:resolved': () => `rodada ${p.summary.roundNumber} fechou`,
    'match:ended': () => `fim: ${(p.winnerIds || []).map(n).join(', ') || 'sem vencedor'}`,
    'system:notice': () => p.code === 'PLAYER_DOOMED' ? `${n(p.params.playerId)} já era` : null,
  }[msg.type];
  const line = t?.();
  if (line) S.log = [line, ...S.log].slice(0, 30);
}

// --- telas -----------------------------------------------------------------

function render() {
  app.replaceChildren();
  (S.screen === 'home' ? home() : room()).forEach((n) => app.append(n));
  if (S.err) app.append($(`<div class="toast">${esc(S.err)}</div>`));
}

const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));

function home() {
  const box = $(`<div class="panel" style="display:grid;gap:10px">
    <input id="nick" placeholder="Seu apelido" maxlength="16">
    <button id="create">Criar sala</button>
    <div class="row"><input id="code" placeholder="Código" maxlength="5" style="flex:1;text-transform:uppercase">
    <button class="ghost" id="join">Entrar</button></div>
  </div>`);
  const nick = () => box.querySelector('#nick').value.trim();
  box.querySelector('#create').onclick = async () => {
    try { enter(await api('/api/rooms', { nickname: nick() })); } catch (e) { S.err = e.message; render(); }
  };
  box.querySelector('#join').onclick = async () => {
    const c = box.querySelector('#code').value.trim().toUpperCase();
    try { enter(await api(`/api/rooms/${c}/join`, { nickname: nick() })); } catch (e) { S.err = e.message; render(); }
  };
  return [
    $(`<h1>FDP</h1>`),
    $(`<p class="muted">Aposte quantas vazas você ganha. Errou, perde vida. A soma da mesa nunca fecha — alguém sempre se dá mal.</p>`),
    box,
  ];
}

function enter(session) {
  S.me = session.playerId; S.token = session.sessionToken; S.code = session.roomCode;
  S.wsUrl = session.wsUrl;
  guardar(session.roomCode, session.sessionToken);
  localStorage.setItem('fdp.ultima', session.roomCode);
  connect(); render();
}

/**
 * Recarregar a página não pode custar o lugar na mesa (CA-040). O token
 * guardado revalida em `/session`, que devolve o mesmo `playerId`; se ele não
 * valer mais, cai na home limpo em vez de tentar conectar com lixo.
 */
async function retomar() {
  const code = new URLSearchParams(location.search).get('sala') || localStorage.getItem('fdp.ultima');
  if (!code) return false;
  const token = guardado(code);
  if (!token) return false;
  try {
    enter(await api(`/api/rooms/${code}/session`, { sessionToken: token }));
    return true;
  } catch {
    esquecer(code);
    return false;
  }
}

function room() {
  const s = S.snap;
  if (!s) return [$(`<p class="muted">conectando…</p>`)];
  const m = s.match;
  const nodes = [$(`<div class="row"><span class="code">${s.code}</span>
    <span class="muted grow">${s.status.toLowerCase().replace(/_/g, ' ')}</span></div>`)];

  if (s.status === 'PAUSADA') nodes.push(pausePanel(s));
  if (!m || s.status === 'LOBBY') nodes.push(lobbyPanel(s));
  else nodes.push(tablePanel(s, m));

  if (S.log.length) nodes.push($(`<div class="panel log">${S.log.map((l) => `<div>${esc(l)}</div>`).join('')}</div>`));
  return nodes;
}

function lobbyPanel(s) {
  const box = $(`<div class="panel" style="display:grid;gap:10px"><h2>Jogadores</h2></div>`);
  s.players.filter((p) => !p.isSpectator).forEach((p) => box.append(playerRow(p, s, null)));
  const isHost = s.hostId === S.me;
  const enough = s.players.filter((p) => !p.isSpectator).length >= 2;
  if (isHost) {
    const b = $(`<button ${enough ? '' : 'disabled'}>Iniciar partida</button>`);
    b.onclick = () => cmd('host:startMatch');
    box.append(b);
    if (!enough) box.append($(`<p class="muted">Faltam jogadores — mínimo 2.</p>`));
  } else box.append($(`<p class="muted">Aguardando o host iniciar.</p>`));
  box.append($(`<p class="muted">Abra outra aba anônima e entre com o código <b>${s.code}</b>.</p>`));
  return box;
}

function pausePanel(s) {
  const names = (s.pause?.absentPlayerIds || []).map((id) => s.players.find((p) => p.id === id)?.nickname || '?');
  const box = $(`<div class="panel banner warn" style="display:grid;gap:9px">
    <b>Partida pausada</b><span class="muted">Esperando ${esc(names.join(', '))} voltar.</span></div>`);
  if (s.hostId === S.me && Date.now() >= (s.pause?.decisionUnlockedAt ?? Infinity)) {
    const a = $(`<button>Continuar sem ${esc(names.join(', '))}</button>`);
    a.onclick = () => cmd('host:resolveAbsence', { action: 'CONTINUAR_SEM' });
    const b = $(`<button class="ghost">Encerrar a partida</button>`);
    b.onclick = () => cmd('host:resolveAbsence', { action: 'ENCERRAR' });
    box.append(a, b);
  }
  return box;
}

function tablePanel(s, m) {
  const box = $(`<div style="display:grid;gap:12px"></div>`);
  const fim = m.endReason !== null;

  box.append($(`<div class="panel row"><span class="grow">Rodada ${m.roundNumber} · ${m.cardsThisRound} carta(s)</span>
    ${m.deckCount > 1 ? `<span class="tag">${m.deckCount} baralhos</span>` : ''}
    ${m.isForeheadRound ? '<span class="tag">na testa</span>' : ''}</div>`));

  if (fim) {
    const win = (m.winnerIds || []).map((id) => s.players.find((p) => p.id === id)?.nickname).join(', ');
    box.append($(`<div class="panel banner"><b>${win ? `🏆 ${esc(win)}` : 'Sem vencedor'}</b>
      <div class="muted">${esc(m.endReason)}</div></div>`));
    if (s.hostId === S.me) { const b = $(`<button>Revanche</button>`); b.onclick = () => cmd('host:rematch'); box.append(b); }
  }

  const list = $(`<div class="panel" style="display:grid;gap:3px"></div>`);
  m.playerOrder.forEach((id) => {
    const p = s.players.find((x) => x.id === id);
    if (p) list.append(playerRow(p, s, m));
  });
  box.append(list);

  // Rodada de testa: as cartas dos outros, e um verso no seu lugar (RJ-100).
  if (m.isForeheadRound && !fim) {
    const wrap = $(`<div class="panel" style="display:grid;gap:8px"><h2>Na testa</h2></div>`);
    const cards = $(`<div class="cards"></div>`);
    m.playerOrder.forEach((id) => {
      const p = s.players.find((x) => x.id === id);
      const c = m.foreheadCards[id];
      const label = p ? p.nickname.slice(0, 6) : '';
      cards.append($(`<div style="text-align:center"><div class="${cardClass(c)}">${cardFace(c)}</div>
        <div class="muted" style="font-size:11px">${esc(label)}</div></div>`));
    });
    wrap.append(cards);
    if (!m.foreheadCards[S.me]) wrap.append($(`<p class="muted">Você não vê a sua carta. Todos os outros veem.</p>`));
    box.append(wrap);
  }

  // Vaza corrente.
  if (m.currentTrick?.plays.length) {
    const t = $(`<div class="panel" style="display:grid;gap:8px"><h2>Vaza ${m.trickNumber}</h2></div>`);
    const cards = $(`<div class="cards"></div>`);
    m.currentTrick.plays.forEach((p) => {
      const who = s.players.find((x) => x.id === p.playerId)?.nickname.slice(0, 6) ?? '';
      cards.append($(`<div style="text-align:center"><div class="${cardClass(p.card)}">${cardFace(p.card)}</div>
        <div class="muted" style="font-size:11px">${esc(who)}</div></div>`));
    });
    t.append(cards);
    box.append(t);
  }

  if (!fim && m.activePlayerId === S.me) box.append(actionPanel(m));
  else if (!fim && s.status !== 'PAUSADA') {
    const who = s.players.find((p) => p.id === m.activePlayerId)?.nickname;
    box.append($(`<div class="panel banner muted">Vez de ${esc(who ?? '—')}</div>`));
  }

  // Própria mão nas rodadas de N>1.
  if (!m.isForeheadRound && m.hand.length) {
    const h = $(`<div class="panel" style="display:grid;gap:8px"><h2>Sua mão</h2></div>`);
    const cards = $(`<div class="cards"></div>`);
    m.hand.forEach((c) => {
      const b = $(`<button class="${cardClass(c)} ${S.sel === c.id ? 'sel' : ''}">${cardFace(c)}</button>`);
      b.onclick = () => { S.sel = S.sel === c.id ? null : c.id; render(); };
      cards.append(b);
    });
    h.append(cards);
    box.append(h);
  }

  return box;
}

function actionPanel(m) {
  const box = $(`<div class="panel" style="display:grid;gap:9px"></div>`);
  if (m.phase === 'APOSTAS') {
    box.append($(`<h2>Sua aposta — ${m.cardsThisRound} vaza(s)</h2>`));
    const row = $(`<div class="bets"></div>`);
    for (let i = 0; i <= m.cardsThisRound; i++) {
      const proibida = m.forbiddenBet === i;
      const rotulo = m.cardsThisRound === 1 ? (i === 1 ? 'Ganho' : 'Perco') : String(i);
      const b = $(`<button ${proibida ? 'disabled' : ''}>${rotulo}</button>`);
      b.onclick = () => cmd('move:bet', { matchId: m.matchId, roundNumber: m.roundNumber, trickNumber: m.trickNumber, bet: i });
      row.append(b);
    }
    box.append(row);
    // O valor proibido aparece desabilitado com a razão: ninguém descobre a
    // restrição errando (RJ-054).
    if (m.forbiddenBet !== null) {
      box.append($(`<p class="muted">Você não pode apostar ${m.forbiddenBet}: a soma da mesa fecharia em ${m.cardsThisRound}.</p>`));
    }
  } else if (m.phase === 'VAZAS') {
    box.append($(`<h2>Sua vez de jogar</h2>`));
    const b = $(`<button ${S.sel ? '' : 'disabled'}>${S.sel ? 'Jogar carta' : 'Escolha uma carta abaixo'}</button>`);
    b.onclick = () => { cmd('move:playCard', { matchId: m.matchId, roundNumber: m.roundNumber, trickNumber: m.trickNumber, cardId: S.sel }); S.sel = null; };
    box.append(b);
  }
  return box;
}

function playerRow(p, s, m) {
  const turn = m && m.activePlayerId === p.id;
  const doomed = m && m.mortoEmVaza?.[p.id] != null;
  const away = (s.pause?.absentPlayerIds || []).includes(p.id);
  const vidas = m ? (m.lives[p.id] ?? 0) : null;
  const aposta = m && m.bets[p.id] !== undefined ? m.bets[p.id] : null;
  const vazas = m ? (m.tricksWon[p.id] ?? 0) : 0;

  const el = $(`<div class="player ${turn ? 'turn' : ''} ${doomed ? 'doomed' : ''} ${away ? 'away' : ''}">
    <div class="av" style="background:var(--${p.avatar.color})">${p.avatar.emoji}</div>
    <div class="grow"><div class="name">${esc(p.nickname)}${p.id === S.me ? ' (você)' : ''}</div>
      <div class="muted">${m ? `${'♥'.repeat(vidas) || '☠'}${aposta !== null ? ` · aposta ${aposta} · ${vazas}/${aposta}` : ''}` : ''}</div></div>
    ${s.hostId === p.id ? '<span class="tag">host</span>' : ''}
    ${away ? '<span class="tag">caiu</span>' : ''}
    ${doomed ? '<span class="tag">já era</span>' : ''}
  </div>`);
  return el;
}

const RED = new Set(['copas', 'ouros']);
const SUIT = { copas: '♥', ouros: '♦', espadas: '♠', paus: '♣' };
const cardClass = (c) => `card ${!c ? 'back' : RED.has(c.suit) ? 'red' : ''}`;
const cardFace = (c) => (c ? `${c.rank}<br>${SUIT[c.suit]}` : '?');

setInterval(() => { if (S.snap?.status === 'PAUSADA') render(); }, 1000);

render();
void retomar();
</script>
</body>
</html>
