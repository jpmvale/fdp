<!--
  O ícone da aba, desenhado a partir da logo.

  SVG e não PNG: precisa ficar legível a 16 px, e nesse tamanho a logo inteira
  — capuz, chamas, três cartas — vira um borrão marrom. O que sobrevive é o
  que a logo tem de próprio: o anel dourado, o fundo quase preto e as letras.

  Duas cores só, as mesmas de `estilos.css`. Sem gradiente: a 16 px ele não
  aparece, e cada parada de cor é peso num arquivo que o navegador busca antes
  de qualquer outra coisa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="32" fill="#080b14"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#e0a33a" stroke-width="4"/>
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="26" letter-spacing="-1" fill="#e0a33a">FDP</text>
</svg>
