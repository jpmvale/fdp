# Publica na VPS depois que o CI passa.
#
# `workflow_run` e não `push`: assim o deploy herda o veredito do CI em vez de
# repetir a suíte, e nada sobe com o teste vermelho. O sha vem do run que
# disparou — `github.sha` aqui apontaria para o branch padrão no momento do
# gatilho, que nem sempre é o commit testado.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  # Dois deploys ao mesmo tempo disputariam o mesmo diretório na VPS, que faz
  # `git checkout --detach` — o segundo trocaria o commit debaixo do primeiro.
  # Sem `cancel-in-progress`: um deploy pela metade é pior que um deploy a mais.
  group: deploy-fdp
  cancel-in-progress: false

jobs:
  publicar:
    # Só com o CI verde. Um `workflow_run` dispara também em falha.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Para empurrar a imagem para o GHCR com o token da própria execução.
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # O commit que o CI aprovou, e não o topo do branch: entre o CI e o
          # deploy pode ter entrado outro push, e publicar o que não foi
          # testado é exatamente o que este gatilho existe para evitar.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Sha curto
        id: sha
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A imagem constrói o cliente dentro dela (Vite) e roda dos fontes sob
      # tsx — ver o Dockerfile. Aqui não há passo de build separado.
      - name: Construir e empurrar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jpmvale/fdp:${{ steps.sha.outputs.tag }}
          # Cache no próprio registro: sem isto cada deploy recompila o
          # `npm ci` inteiro, que é a parte lenta.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Chave de deploy
        run: |
          mkdir -p ~/.ssh

          # `printf '%s\n'` e `tr -d '\r'`: a chave precisa terminar em quebra
          # de linha, e um segredo colado de um editor de Windows chega com CR
          # no fim de cada linha. Os dois casos produzem o mesmo erro cru do
          # OpenSSH — "error in libcrypto" —, que não diz nada sobre a causa.
          printf '%s\n' "${{ secrets.VPS_DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Falha aqui, com o motivo escrito, em vez de lá adiante como
          # "Permission denied (publickey)" — que manda procurar no lugar
          # errado, o servidor, quando o problema está no segredo.
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::VPS_DEPLOY_KEY não é uma chave privada OpenSSH válida. Cole o arquivo INTEIRO, com as linhas BEGIN e END — e a privada, não a .pub."
            exit 1
          fi

          # Impressão digital não é segredo, e é o que permite comparar com a
          # entrada do authorized_keys sem expor chave nenhuma.
          echo "chave carregada: $(ssh-keygen -lf ~/.ssh/id_deploy | awk '{print $2}')"

          # Fixa a identidade do host: sem isto, `StrictHostKeyChecking=no`
          # aceitaria qualquer servidor que atendesse no meio do caminho.
          printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" | tr -d '\r' > ~/.ssh/known_hosts

      # A chave está presa a `~/bin/deploy.sh` por forced command: o que vai
      # aqui chega em SSH_ORIGINAL_COMMAND e nunca é executado como shell.
      # Vazada, ela publica uma imagem que já existe no GHCR — não abre sessão
      # nem roda comando arbitrário.
      - name: Publicar na VPS
        run: |
          ssh -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            deploy@${{ secrets.VPS_HOST }} \
            "fdp ${{ steps.sha.outputs.tag }}"
