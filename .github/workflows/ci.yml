name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Sem os serviços de pé, as suítes de contrato se pulam sozinhas e o CI
    # daria verde sem ter testado as implementações que vão para produção.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      postgres:
        image: postgres:17-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: fdp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # MinIO fala S3, e é contra ele que a assinatura SigV4 escrita à mão em
      # `packages/avatares/src/assinatura.ts` é provada. Colar um vetor de
      # referência num `expect` conferiria um caso; um servidor de verdade
      # confere o protocolo.
      #
      # Sobe aqui, e não em `services:`, porque a imagem do MinIO exige o
      # comando `server /data` e `services:` não deixa passar comando nenhum.
      - name: MinIO de pé
        run: |
          docker run -d --name fdp-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=fdpteste -e MINIO_ROOT_PASSWORD=fdptestesenha \
            minio/minio:latest server /data

          # Espera ativa com teto. Sem ela, o primeiro teste corre contra um
          # servidor que ainda não abriu a porta, e a falha parece da
          # assinatura — que é o que este serviço existe para provar.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO pronto em ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::MinIO não subiu em 30s"
          docker logs fdp-minio
          exit 1

      # Tipagem estrita: sem `any` na fronteira de dados (RNF-103).
      - name: Typecheck
        run: npx tsc -b --pretty

      # Antes dos testes: o servidor serve `app/build/`, e a suíte de HTTP lê
      # o `index.html` de lá. Sem este passo ela falha por arquivo ausente, e o
      # sintoma (500 na raiz) não parece o que é.
      - name: Build do cliente
        run: npm run build:client

      # RNF-055: o bundle inicial não passa de 180 KB comprimido. Verificado
      # aqui e não no code review porque é o tipo de teto que se fura sem
      # ninguém notar, uma dependência por vez.
      - name: Orçamento do bundle
        run: |
          BYTES=$(cat app/build/assets/*.js | gzip -9 | wc -c)
          TETO=$((180 * 1024))
          echo "bundle: $BYTES bytes comprimidos (teto $TETO)"
          if [ "$BYTES" -gt "$TETO" ]; then
            echo "::error::o bundle passou de 180 KB comprimidos (RNF-055)"
            exit 1
          fi

      # Inclui CA-310/CA-311: 1.000 partidas simuladas sem violar invariante,
      # e a suíte de contrato do RoomStore contra Redis de verdade.
      - name: Testes
        run: npm test
        env:
          REDIS_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgres://postgres:fdp@127.0.0.1:5432/postgres
          R2_ENDPOINT: http://127.0.0.1:9000
          R2_BUCKET: avatares
          R2_ACCESS_KEY_ID: fdpteste
          R2_SECRET_ACCESS_KEY: fdptestesenha

      # As duas suítes se pulam sem a variável; aqui elas são obrigatórias.
      # Pular no CI é o pior resultado possível: verde sem ter testado.
      - name: Os contratos rodaram contra os serviços de verdade
        run: |
          for pacote in packages/store packages/contas packages/avatares; do
            if npm test -- "$pacote" 2>&1 | grep -q "skipped"; then
              echo "::error::a suíte de contrato de $pacote foi pulada no CI"
              exit 1
            fi
            echo "contrato de $pacote verificado contra o serviço real"
          done
        env:
          REDIS_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgres://postgres:fdp@127.0.0.1:5432/postgres
          R2_ENDPOINT: http://127.0.0.1:9000
          R2_BUCKET: avatares
          R2_ACCESS_KEY_ID: fdpteste
          R2_SECRET_ACCESS_KEY: fdptestesenha

      # Compilado dentro de `src/` faz o Vite resolver o `.js` em vez do `.ts`
      # (os imports são `'./room.js'`, convenção ESM do TypeScript), e a suíte
      # passa a rodar contra código velho SEM AVISO NENHUM. Aconteceu em
      # 25/08/2026 e custou uma hora de depuração de um bug que não existia.
      - name: Nada de compilado dentro de src/
        run: |
          achados=$(find packages/*/src server/src app/src \
            \( -name '*.js' -o -name '*.d.ts' -o -name '*.js.map' \) 2>/dev/null || true)
          if [ -n "$achados" ]; then
            echo "::error::há saída de compilação dentro de src/ — o Vite vai resolver o .js e não o .ts"
            echo "$achados"
            exit 1
          fi
          echo "src/ limpo"

      # O cliente não conhece a máquina de sala. O TESTE de equivalência dos
      # redutores conhece — é a razão de ele existir, comparar os dois lados —,
      # e por isso `app/tsconfig.json` referencia `packages/room`. Sem esta
      # trava a referência viraria porta aberta para o `app/src` importar a
      # sala e passar a decidir regra no cliente.
      - name: O cliente não importa a máquina de sala
        run: |
          if grep -rn "@fdp/room" app/src; then
            echo "::error::app/src importou @fdp/room — regra de jogo não se decide no cliente"
            exit 1
          fi
          echo "fronteira do cliente ok"

      # RJ-143: o motor de regras não pode alcançar UI, rede nem store.
      - name: Fronteira de imports do motor de regras
        run: |
          if grep -rnE "from '(@fdp/(store|protocol|room)|\.\./\.\./(app|server))" packages/rules/src; then
            echo "::error::packages/rules importou fora da própria fronteira (RJ-143)"
            exit 1
          fi
          echo "fronteira preservada"

      # A auditoria de `docs/` roda no CI por causa do RNF-106, e SÓ por causa
      # dele: a dívida do RNF-102 é reportada e não falha (é grande demais para
      # virar portão da noite para o dia), mas fase de plano marcada como
      # concluída sem o teste do gate dela falha o build. A regra nasceu com
      # dívida zero, e um portão só fica fechado se for fechado desde o
      # primeiro dia.
      - name: Gates de fase (RNF-106)
        run: npm run auditoria

      # A suíte E2E: os critérios `E` de `10`, que só existem num navegador de
      # verdade — duas abas vendo a mesma sala, a área de transferência, o link
      # de convite. Roda depois dos unitários de propósito: quando os dois
      # quebram juntos, o unitário diz onde, e o E2E só diria que "não
      # funcionou".
      #
      # `--with-deps` porque o runner do GitHub não traz as bibliotecas de
      # sistema que o Chromium precisa; sem elas o navegador nem abre.
      - name: Navegador do E2E
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e
        env:
          CI: 'true'
          DATABASE_URL: postgres://postgres:fdp@127.0.0.1:5432/postgres

      - name: Guardar o rastro do E2E que falhou
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rastro-e2e
          path: test-results/
          retention-days: 7

      # RJ-140: tempo e aleatoriedade entram por parâmetro, nunca do ambiente.
      - name: Pureza do motor de regras
        run: |
          if grep -rn "Date\.now\|Math\.random" packages/rules/src --include=*.ts | grep -v '^\S*: *\*'; then
            echo "::error::packages/rules usa Date.now ou Math.random (RJ-140)"
            exit 1
          fi
          echo "motor puro"
