name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Sem Redis de pé, a suíte de contrato do RoomStore se pula sozinha e o CI
    # daria verde sem ter testado a implementação que vai para produção.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Tipagem estrita: sem `any` na fronteira de dados (RNF-103).
      - name: Typecheck
        run: npx tsc -b --pretty

      # Antes dos testes: o servidor serve `app/build/`, e a suíte de HTTP lê
      # o `index.html` de lá. Sem este passo ela falha por arquivo ausente, e o
      # sintoma (500 na raiz) não parece o que é.
      - name: Build do cliente
        run: npm run build:client

      # RNF-055: o bundle inicial não passa de 180 KB comprimido. Verificado
      # aqui e não no code review porque é o tipo de teto que se fura sem
      # ninguém notar, uma dependência por vez.
      - name: Orçamento do bundle
        run: |
          BYTES=$(cat app/build/assets/*.js | gzip -9 | wc -c)
          TETO=$((180 * 1024))
          echo "bundle: $BYTES bytes comprimidos (teto $TETO)"
          if [ "$BYTES" -gt "$TETO" ]; then
            echo "::error::o bundle passou de 180 KB comprimidos (RNF-055)"
            exit 1
          fi

      # Inclui CA-310/CA-311: 1.000 partidas simuladas sem violar invariante,
      # e a suíte de contrato do RoomStore contra Redis de verdade.
      - name: Testes
        run: npm test
        env:
          REDIS_URL: redis://127.0.0.1:6379

      # A suíte de Redis se pula sem REDIS_URL; aqui ela é obrigatória.
      - name: O contrato do RoomStore rodou contra Redis
        run: |
          if npm test -- packages/store 2>&1 | grep -q "skipped"; then
            echo "::error::a suíte de contrato do Redis foi pulada no CI"
            exit 1
          fi
          echo "contrato verificado contra Redis"
        env:
          REDIS_URL: redis://127.0.0.1:6379

      # O cliente não conhece a máquina de sala. O TESTE de equivalência dos
      # redutores conhece — é a razão de ele existir, comparar os dois lados —,
      # e por isso `app/tsconfig.json` referencia `packages/room`. Sem esta
      # trava a referência viraria porta aberta para o `app/src` importar a
      # sala e passar a decidir regra no cliente.
      - name: O cliente não importa a máquina de sala
        run: |
          if grep -rn "@fdp/room" app/src; then
            echo "::error::app/src importou @fdp/room — regra de jogo não se decide no cliente"
            exit 1
          fi
          echo "fronteira do cliente ok"

      # RJ-143: o motor de regras não pode alcançar UI, rede nem store.
      - name: Fronteira de imports do motor de regras
        run: |
          if grep -rnE "from '(@fdp/(store|protocol|room)|\.\./\.\./(app|server))" packages/rules/src; then
            echo "::error::packages/rules importou fora da própria fronteira (RJ-143)"
            exit 1
          fi
          echo "fronteira preservada"

      # RJ-140: tempo e aleatoriedade entram por parâmetro, nunca do ambiente.
      - name: Pureza do motor de regras
        run: |
          if grep -rn "Date\.now\|Math\.random" packages/rules/src --include=*.ts | grep -v '^\S*: *\*'; then
            echo "::error::packages/rules usa Date.now ou Math.random (RJ-140)"
            exit 1
          fi
          echo "motor puro"
