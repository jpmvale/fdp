# Produção na VPS srv1876937, que hospeda coda, kindred e expense-analyzer.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Nenhum serviço publica porta no host: quem escuta de fora é o Caddy
# compartilhado, que alcança a API pela rede `edge`. O Redis fica só na
# `internal` — nem o Caddy o enxerga.

services:
  redis:
    image: redis:7-alpine
    container_name: fdp-redis
    restart: unless-stopped
    # Redis PRÓPRIO do FDP, e não o `coda-redis-1` que já roda na máquina:
    # compartilhar significaria que um `FLUSHALL` de um projeto derruba as
    # partidas do outro, e que a memória de um é orçamento do outro.
    #
    # Sem `requirepass` porque a porta não sai da rede interna do compose. Se
    # um dia este Redis for publicado, a senha deixa de ser opcional.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Sem persistência em disco de propósito (RNF-063): salas têm TTL de 4 h e
    # perder tudo encerra as partidas em curso e nada mais. O que precisa
    # sobreviver a reinício de PROCESSO já sobrevive — o Redis só cai junto com
    # a máquina, e aí a partida acabou de qualquer jeito.
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: fdp-postgres
    restart: unless-stopped
    # Contas, credenciais, identidades de SSO e histórico (`11` §4.2). É o
    # OPOSTO do Redis ao lado em tudo que importa: nada expira, a escrita é
    # transacional, e a integridade é do banco.
    environment:
      POSTGRES_USER: fdp
      POSTGRES_DB: fdp
      POSTGRES_PASSWORD: ${FDP_DB_PASSWORD:?defina FDP_DB_PASSWORD no .env}
      # Sem isto o initdb usa `trust` para conexões locais dentro do container.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    # Usuário próprio, e não `postgres` superusuário: a aplicação não precisa
    # de superusuário, e foi por isso que o esquema deixou de depender da
    # extensão `citext` (que exigiria).
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Só na `internal`: nem o Caddy o enxerga, e nenhuma porta sai da máquina.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdp -d fdp"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    # `image` + `build` juntos, como nos outros apps da máquina: local,
    # `docker compose build` constrói e marca com este nome; na VPS,
    # `docker compose pull` baixa do GHCR sem compilar nada. IMAGE_TAG é o sha
    # do commit, injetado pela esteira.
    image: ghcr.io/jpmvale/fdp:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fdp-api
    restart: unless-stopped
    environment:
      # Obrigatório em produção: sem ele o processo recusa subir (RNF-075).
      # Estável entre reinícios — trocá-lo invalida toda sessão viva e derruba
      # as partidas em curso.
      FDP_SESSION_SECRET: ${FDP_SESSION_SECRET:?defina FDP_SESSION_SECRET no .env}
      REDIS_URL: redis://redis:6379
      # Contas (P11). A aplicação sobe SEM isto e sem o banco no ar — jogar não
      # depende de conta (plano 01, I-1) —, mas em produção queremos as duas
      # coisas de pé.
      DATABASE_URL: postgres://fdp:${FDP_DB_PASSWORD:?defina FDP_DB_PASSWORD no .env}@postgres:5432/fdp
      # SSO (P11, F3). **Opcionais de propósito**, sem `:?`: faltando, o app
      # sobe, `/api/sso` devolve lista vazia e a tela não desenha botão — um
      # botão que responde 503 é pior que nenhum. Exigi-los aqui faria o jogo
      # depender de dois terceiros para subir.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ALLOWED_ORIGIN: https://fdp.imp-software.cloud
      # Só é seguro PORQUE o Caddy está na frente e sobrescreve
      # X-Forwarded-For. Nenhuma porta deste stack sai da máquina; se um dia
      # sair, qualquer um forja o cabeçalho e contorna o rate limit (RNF-003).
      TRUST_PROXY: "1"
      PORT: "3000"
      FDP_VERSION: ${IMAGE_TAG:-dev}
    networks:
      - internal
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # `SIGTERM` e 20 s de janela: `main.ts` fecha as conexões avisando os
    # clientes e persiste as salas sujas antes de sair. É o caminho que CA-046
    # exercita — a partida atravessa o deploy.
    stop_signal: SIGTERM
    stop_grace_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      # Postgres é `service_started`, e NÃO `service_healthy`, de propósito.
      #
      # Com `healthy`, um banco que não sobe impede a API de subir — e o jogo
      # ficaria refém da parte opcional dele. É exatamente a invariante I-1 do
      # plano 01 invertida: conta é acréscimo, nunca pedágio, e banco fora do
      # ar não pode tirar do ar um jogo que funciona por link e sem cadastro.
      # `main.ts` já trata a conexão que falha subindo sem contas.
      postgres:
        condition: service_started

volumes:
  # Nomeado, e não bind mount: é o que o `pg_dump` de `deploy/backup-postgres.sh`
  # protege, e o que sobrevive a `docker compose down`.
  postgres-data:

networks:
  internal:
    driver: bridge
  # Criada fora do compose: `docker network create edge`. É por ela que o Caddy
  # compartilhado alcança os projetos sem que eles se enxerguem entre si.
  edge:
    external: true
